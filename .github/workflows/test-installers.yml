name: Test Installers

on:
  push:
    paths:
      - 'install.sh'
      - 'auto-install-*.sh'
      - 'Modelfile'
      - 'SHA256SUMS'
      - 'README.md'
      - 'INSTALLATION.md'
      - 'MODEL-CARD.md'
      - 'SECURITY.md'
      - 'SECURITY-AUDIT.md'
      - 'REFACTOR_BRIEF.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/CONTRIBUTING.md'
      - '.github/workflows/test-installers.yml'
      - 'tests/**'
      - 'docs/**'
      - 'templates/**'
      - 'assets/kali-lite-banner.png'
      - 'assets/kali-lite-overview.webp'

  pull_request:
    paths:
      - 'install.sh'
      - 'auto-install-*.sh'
      - 'Modelfile'
      - 'SHA256SUMS'
      - 'README.md'
      - 'INSTALLATION.md'
      - 'MODEL-CARD.md'
      - 'SECURITY.md'
      - 'SECURITY-AUDIT.md'
      - 'REFACTOR_BRIEF.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/CONTRIBUTING.md'
      - '.github/workflows/test-installers.yml'
      - 'tests/**'
      - 'docs/**'
      - 'templates/**'
      - 'assets/kali-lite-banner.png'
      - 'assets/kali-lite-overview.webp'

  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: kali-lite-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint-shell:
    name: Bash syntax & ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            install.sh
            auto-install-kali-lite-v1-novision.sh
            auto-install-kali-lite-v2-vision.sh
            tests/test_structure.sh
            tests/test_pid_fidelity.sh
            tests/test_dry_run.sh
            tests/test-no-secret-leak.sh
          )

          for script in "${scripts[@]}"; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          shellcheck \
            --severity=error \
            install.sh \
            auto-install-kali-lite-v1-novision.sh \
            auto-install-kali-lite-v2-vision.sh \
            tests/test_structure.sh \
            tests/test_pid_fidelity.sh \
            tests/test_dry_run.sh \
            tests/test-no-secret-leak.sh


  repository-invariants:
    name: Repository structure & invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_structure.sh

      - name: Validate Ollama PID fidelity
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_pid_fidelity.sh


  checksum-verification:
    name: Verify published SHA-256
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          echo "Published checksums:"
          cat SHA256SUMS
          echo ""

          sha256sum --check SHA256SUMS


  dry-run-isolation:
    name: Dry-run has no side effects
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute isolated dry-run tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_dry_run.sh


  secret-regression:
    name: Secret regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run secret regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-no-secret-leak.sh


  installer-interface:
    name: Installer interface smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate help interface
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            install.sh
            auto-install-kali-lite-v1-novision.sh
            auto-install-kali-lite-v2-vision.sh
          )

          for script in "${scripts[@]}"; do
            echo "=== $script --help ==="
            bash "$script" --help
          done

      - name: Validate required options exist
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            install.sh
            auto-install-kali-lite-v1-novision.sh
            auto-install-kali-lite-v2-vision.sh
          )

          for script in "${scripts[@]}"; do
            grep -q -- '--dry-run' "$script"
            grep -q -- '--uninstall' "$script"
            grep -q -- '--help' "$script"
          done


  active-code-security:
    name: Active installer security guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check forbidden legacy patterns
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            install.sh
            auto-install-kali-lite-v1-novision.sh
            auto-install-kali-lite-v2-vision.sh
          )

          for script in "${scripts[@]}"; do
            echo "Checking active installer: $script"

            if grep -q 'dangerously-skip-permissions' "$script"; then
              echo "FAIL: dangerously-skip-permissions found in $script"
              exit 1
            fi

            if grep -q 'ANTHROPIC_' "$script"; then
              echo "FAIL: Anthropic environment variable found in $script"
              exit 1
            fi

            if grep -qi 'claude-code' "$script"; then
              echo "FAIL: Claude Code dependency found in $script"
              exit 1
            fi

            if grep -qi 'nodesource' "$script"; then
              echo "FAIL: NodeSource dependency found in $script"
              exit 1
            fi

            if grep -Eq 'curl.*\|[[:space:]]*(bash|sh)|wget.*\|[[:space:]]*(bash|sh)' "$script"; then
              echo "FAIL: remote script piped directly to shell in $script"
              exit 1
            fi
          done

          echo "PASS: no forbidden legacy pattern found in active installers"


  final-status:
    name: Kali-Lite CI verdict
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-shell
      - repository-invariants
      - checksum-verification
      - dry-run-isolation
      - secret-regression
      - installer-interface
      - active-code-security

    steps:
      - name: Evaluate CI result
        shell: bash
        run: |
          set -euo pipefail

          failures=0

          check_result() {
            local name="$1"
            local result="$2"

            if [[ "$result" == "success" ]]; then
              echo "PASS: $name"
            else
              echo "FAIL: $name -> $result"
              failures=$((failures + 1))
            fi
          }

          check_result "lint-shell" "${{ needs.lint-shell.result }}"
          check_result "repository-invariants" "${{ needs.repository-invariants.result }}"
          check_result "checksum-verification" "${{ needs.checksum-verification.result }}"
          check_result "dry-run-isolation" "${{ needs.dry-run-isolation.result }}"
          check_result "secret-regression" "${{ needs.secret-regression.result }}"
          check_result "installer-interface" "${{ needs.installer-interface.result }}"
          check_result "active-code-security" "${{ needs.active-code-security.result }}"

          echo ""

          if [[ "$failures" -gt 0 ]]; then
            echo "KALI-LITE CI: FAIL"
            exit 1
          fi

          echo "KALI-LITE CI: PASS"
